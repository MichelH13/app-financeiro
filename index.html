<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Finance Pro | Contas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="app-container">
        <header class="main-header">
            <span class="user-welcome">Administração do Mês</span>
            <div class="balance-section">
                <p>Saldo em Conta</p>
                <h1 id="total-balance">R$ 0,00</h1>
            </div>
        </header>

        <main class="content">
            <section class="card chart-card">
                <canvas id="financeChart"></canvas>
                <div class="chart-info">
                    <span id="chart-total">R$ 0,00</span>
                    <p>Total Saídas</p>
                </div>
            </section>

            <section class="history-section">
                <div class="section-title">
                    <h3>Extrato Detalhado</h3>
                    <button onclick="clearAllData()" class="btn-clear">Zerar Mês</button>
                </div>
                <div id="list" class="transaction-list"></div>
            </section>
        </main>

        <div id="transaction-modal" class="modal">
            <div class="modal-content">
                <div class="modal-handle"></div>
                <h2>Novo Lançamento</h2>
                
                <input type="text" id="desc" placeholder="Ex: Mercado Nagumo">
                <input type="number" id="amount" placeholder="Valor R$">
                
                <select id="category">
                    <optgroup label="Entradas">
                        <option value="Salario">💰 Salário Mensal</option>
                        <option value="Dinheiro Extra">➕ Renda Extra</option>
                    </optgroup>
                    <optgroup label="Despesas Fixas">
                        <option value="Cartao de Credito">💳 Cartão de Crédito</option>
                        <option value="Contas Fixas">🏠 Contas (Luz/Água)</option>
                        <option value="Telefone">📱 Telefone/Internet</option>
                    </optgroup>
                    <optgroup label="Consumo">
                        <option value="Mercado">🛒 Mercado/Compra</option>
                        <option value="Padaria">🍞 Padaria</option>
                        <option value="Farmacia">💊 Farmácia</option>
                        <option value="Combustivel">⛽ Combustível</option>
                        <option value="Outros">⚙️ Outros Gastos</option>
                    </optgroup>
                </select>

                <button class="btn-confirm" onclick="addTransaction()">Lançar Agora</button>
                <button class="btn-close" onclick="toggleModal()">Voltar</button>
            </div>
        </div>

        <button class="fab" onclick="toggleModal()">
            <i class="bi bi-plus-lg"></i>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
